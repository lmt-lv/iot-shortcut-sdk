# Disable Zephyr console
CONFIG_CONSOLE=n

# Multithreading
CONFIG_MULTITHREADING=y

# MCUBoot settings
CONFIG_BOOT_MAX_IMG_SECTORS=256

# MCUboot serial recovery
CONFIG_MCUBOOT_SERIAL=n

CONFIG_SPI_NOR_SFDP_RUNTIME=y

# Needed otherwise "erase_full_slot" function is not compiled for mcuboot.
CONFIG_MCUBOOT_CLEANUP_UNUSABLE_SECONDARY=y